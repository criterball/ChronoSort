[package]
name = "cs-ai"
description = "Which AI models fit this PC (tiers, catalogue), linked model files, and verified model downloads (the only network code)."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cs-platform = { version = "0.1.0", path = "../cs-platform" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "3", features = ["platform-verifier"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
