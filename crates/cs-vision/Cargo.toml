[package]
name = "cs-vision"
description = "Runs the local vision model (llama.cpp llama-server, 127.0.0.1 only, offline) and asks it to date a photo."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cs-platform = { version = "0.1.0", path = "../cs-platform" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
ureq = "3"

[lints]
workspace = true

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
cs-faces = { version = "0.1.0", path = "../cs-faces" }
