[package]
name = "cs-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ChronoSort's application logic without a user interface (edit session, file housekeeping with Undo, ExifTool)."

[dependencies]
cs-adjust = { path = "../cs-adjust" }
cs-core = { path = "../cs-core" }
cs-exec = { path = "../cs-exec" }
cs-geo = { path = "../cs-geo" }
cs-image = { path = "../cs-image" }
cs-meta = { path = "../cs-meta" }
cs-model = { path = "../cs-model" }
cs-platform = { path = "../cs-platform" }
cs-scan = { path = "../cs-scan" }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
trash = "5.4.0"
rayon = "1.12.0"
cs-thumb = { path = "../cs-thumb" }
cs-video = { path = "../cs-video" }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
