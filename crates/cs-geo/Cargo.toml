[package]
name = "cs-geo"
description = "Add a place (GPS and place names) to photos, offline: ExifTool's built-in GeoNames city list, writes through ExifTool with a verified backup for undo."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cs-core = { version = "0.1.0", path = "../cs-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1.26"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
